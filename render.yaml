# Render Blueprint for CP Compass — one free web service (Docker).
# Apply from the Render dashboard: New -> Blueprint -> select the
# Khalid635/cp-compass repo. No paid plan, no card.
# After creation, set the two `sync: false` values in the dashboard:
#   DATABASE_URL — Neon Postgres connection string (pooled, with ?sslmode=require)
#   SECRET_KEY   — the production key (stored on the laptop at
#                  D:\Projects\cp-compass\backend\.env.production)
# Then update CORS_ORIGINS below to the real Vercel URL and redeploy.
services:
  - type: web
    name: cp-compass-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://cp-compass.vercel.app
      - key: CF_API_BASE
        value: https://codeforces.com/api
      - key: PYTHONUNBUFFERED
        value: "1"
