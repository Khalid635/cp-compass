<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>CP Compass — Concept 1: Rising Needle</title>
  <!-- Compass ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#2BB8C6" stroke-width="30"/>
  <!-- Needle that doubles as a rising chart line: shallow rise, then a steep climb -->
  <polyline points="145,355 240,290 335,170" fill="none" stroke="#2BB8C6" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Data points on the chart -->
  <circle cx="145" cy="355" r="16" fill="#2BB8C6"/>
  <circle cx="240" cy="290" r="16" fill="#2BB8C6"/>
  <!-- Gold arrowhead: the needle points north-east, up and to the right -->
  <polygon points="360,139 353,189 313,157" fill="#ffc800"/>
</svg>
